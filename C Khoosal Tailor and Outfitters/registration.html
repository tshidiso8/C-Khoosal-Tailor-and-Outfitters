             <h1>Registration Form</h1>
        <!-- Registration form -->
         <form method="post" action="" >
            <fieldset>
            <legend> Sign Up </legend>
            
            <label> Name:</label>
            <input type="text" name="first_name" placeholder="Enter your first name"> <br>
            <label> Surname:</label>
            <input type="text" name="surname" placeholder="Enter your surname"> <br>
            <label>Email:</label>
            <input type="email" name="email" placeholder="Enter your email"> <br>
            <label> Cell Number:</label>
            <input type="number" name="cell_number" placeholder="Enter your cell number"> <br>
            <label>Password:</label>
            <input type="password" name="password" placeholder="Enter your password"> <br>
            <label> Date Of Birth:</label>
            <input type="date of birth" name="date_of_birth" placeholder="yyyy/mm/dd">

            <input type="submit" value="Submit">
            <button type="Reset">Reset</button>
            </fieldset>


         </form>
